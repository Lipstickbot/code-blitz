services:
  api:
    build:
      context: .
    image: code-blitz-backend:staging
    restart: unless-stopped
    env_file:
      - ${BLITZCODE_ENV_FILE:-.env.staging}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${BLITZCODE_ENV_FILE:-.env.staging}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - ../..:/srv/code-blitz-static:ro
      - blitzcode_staging_caddy_data:/data
      - blitzcode_staging_caddy_config:/config

  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${BLITZCODE_ENV_FILE:-.env.staging}
    environment:
      POSTGRES_USER: blitzcode
      POSTGRES_DB: blitzcode
    volumes:
      - blitzcode_staging_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blitzcode -d blitzcode"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - blitzcode_staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  blitzcode_staging_db_data:
  blitzcode_staging_redis_data:
  blitzcode_staging_caddy_data:
  blitzcode_staging_caddy_config:
