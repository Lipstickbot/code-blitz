name: Code Blitz CI/CD

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blitzcode
          POSTGRES_PASSWORD: blitzcode
          POSTGRES_DB: blitzcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blitzcode -d blitzcode"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://blitzcode:blitzcode@127.0.0.1:5432/blitzcode
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMITER_BACKEND: redis
      JWT_SECRET: ci-secret-value-with-more-than-32-characters
      AUTO_CREATE_TABLES: "false"
      JUDGE_EXECUTOR: docker
      JUDGE_DOCKER_BINARY: docker
      JUDGE_PYTHON_IMAGE: python:3.12-alpine
      JUDGE_NODE_IMAGE: node:22-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blitzcode-mvp/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: blitzcode-mvp/backend
        run: python -m pip install -r requirements.txt

      - name: Pull judge runtime images
        run: |
          docker pull python:3.12-alpine
          docker pull node:22-alpine

      - name: Run backend checks
        working-directory: blitzcode-mvp/backend
        run: python scripts/check_backend.py --with-preflight

      - name: Check migrations can upgrade
        working-directory: blitzcode-mvp/backend
        run: alembic upgrade head

  static-ui:
    name: Static UI check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check static app JavaScript
        run: node --check app.js

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    needs:
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t code-blitz-backend:ci blitzcode-mvp/backend

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - backend
      - static-ui
      - backend-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_ENABLED: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_KEY != '' && secrets.DEPLOY_PATH != '' }}
      DEPLOY_MODE: ${{ secrets.DEPLOY_MODE }}

    steps:
      - name: Deploy over SSH
        if: env.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            DEPLOY_MODE="${DEPLOY_MODE:-staging}"
            if [ "$DEPLOY_MODE" = "staging" ]; then
              cd blitzcode-mvp/backend
              bash scripts/deploy_staging.sh
            else
              cd blitzcode-mvp/backend
              docker compose up -d
              python scripts/preflight_production.py --env-file .env.production
              alembic upgrade head
              sudo systemctl restart code-blitz-api
            fi

      - name: Skip deploy
        if: env.DEPLOY_ENABLED != 'true'
        run: echo "Deploy secrets are not configured; CI finished without deployment."
